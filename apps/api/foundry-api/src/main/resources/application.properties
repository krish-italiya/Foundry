spring.application.name=foundry-api

# Persist registered projects and repository trust across local API restarts.
# The local database lives under .foundry/ and is intentionally git-ignored.
spring.datasource.url=jdbc:h2:file:./.foundry/data/foundry;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Background processing stays disabled unless explicitly enabled.
foundry.worker.enabled=false
foundry.worker.poll-interval-ms=1000

# Local runtime stays disabled unless explicitly enabled.
foundry.runtime.local.enabled=false
foundry.runtime.local.sample-mode-enabled=false
foundry.runtime.local.sample-jar=apps/samples/hello-service/target/hello-service-0.1.0.jar
# Active local applications are routed by UUID subdomain through Foundry's API port.
# This localhost URL is for local preview only, not public hosting.
foundry.runtime.local.application-base-url=http://localhost:8080
foundry.runtime.local.monitor-interval-ms=5000

# Repository builds stay disabled until a repository is explicitly trusted.
# Isolated builder containers are separately opt-in. When enabled, only build commands run in Docker;
# checkout/manifest discovery remain on the host, and build outputs are copied back for runtime packaging.
foundry.build.container.enabled=false
foundry.build.container.maven-image=maven:3.9-eclipse-temurin-25-noble
foundry.build.container.node-image=node:22-bookworm-slim
foundry.build.container.memory-limit=3g
foundry.build.container.cpu-limit=2.0
foundry.build.container.workspace-tmpfs-limit=4g
foundry.build.container.image-pull-timeout-seconds=600
foundry.build.container.cleanup-interval-ms=30000
foundry.build.enabled=false
foundry.build.workspace-root=.foundry/workspaces
foundry.build.allowed-repositories=
foundry.build.command-timeout-seconds=600


# Docker runtime is a separate opt-in backend and requires Docker Desktop/Engine.
# Do not enable this together with foundry.runtime.local.enabled.
foundry.runtime.docker.enabled=false
foundry.runtime.docker.command=docker
foundry.runtime.docker.context-root=.foundry/docker-contexts
foundry.runtime.docker.memory-limit=512m
foundry.runtime.docker.cpu-limit=1.0
foundry.runtime.docker.build-timeout-seconds=600
# Retry failed cleanup and discover stale UUID-named runtime resources after a control-plane restart.
foundry.runtime.docker.cleanup-interval-ms=30000
